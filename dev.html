<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Flappy Dawn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Titan+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2b3d;
  --paper:#fff6e4;
  --paper-2:#ffe9c7;
  --accent:#ff6b35;
  --gold:#ffb347;
  --sky:#7ec3f2;
  --muted:#5b6b80;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:'Nunito','Segoe UI',system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;overflow:hidden;cursor:pointer;background:var(--sky)}
#c{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none}
.display{font-family:'Titan One','Nunito',sans-serif;font-weight:400;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 10px 22px rgba(31,43,61,.28);letter-spacing:.02em}
#score{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:clamp(46px,10vmin,92px);line-height:1;font-variant-numeric:tabular-nums}
#score.pop{animation:pop .3s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
#title{position:absolute;top:calc(7vh + env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 16px}
#title h1{margin:0;font-size:clamp(52px,13vmin,124px);line-height:.95;color:var(--gold);transform:rotate(-3deg);text-align:center;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:9px 20px;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;box-shadow:4px 4px 0 var(--ink)}
.chip.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateY(0) rotate(1deg)}50%{transform:translateY(-6px) rotate(-1deg)}}
.chip.small{font-size:12px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}
.chip.small b{font-family:'Titan One','Nunito',sans-serif;font-weight:400;font-size:15px;color:var(--accent)}
#hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-weight:700;font-size:14px;color:var(--ink);opacity:.72;letter-spacing:.03em;padding:0 16px}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1.5deg);background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:7px 7px 0 var(--ink);padding:20px 24px 22px;width:min(86vw,340px);box-sizing:border-box;text-align:center;pointer-events:auto;cursor:default}
.card.in{animation:cardIn .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardIn{from{transform:translate(-50%,-30%) rotate(5deg) scale(.6);opacity:0}to{transform:translate(-50%,-50%) rotate(-1.5deg) scale(1);opacity:1}}
.eyebrow{font-family:'Titan One','Nunito',sans-serif;font-size:clamp(28px,5.5vmin,38px);color:var(--accent);-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);letter-spacing:.02em;line-height:1.1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 12px}
.stat{background:var(--paper-2);border:2px solid var(--ink);border-radius:14px;padding:10px 8px 8px}
.stat .lbl{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat .num{display:block;font-family:'Titan One','Nunito',sans-serif;font-size:38px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.medal{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;min-height:28px}
.medal .disc{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18);background:#cd8b56}
.ribbon{display:inline-block;margin-top:8px;background:var(--accent);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px 12px;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--ink)}
.btn{display:block;width:100%;margin-top:16px;background:var(--ink);color:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:12px;font-family:'Titan One','Nunito',sans-serif;font-size:20px;letter-spacing:.04em;box-shadow:4px 4px 0 var(--accent);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--accent)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--accent)}
.btn:focus-visible,#mute:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sub{margin-top:10px;font-size:13px;font-weight:600;color:var(--muted)}
#toast{position:absolute;top:calc(22px + env(safe-area-inset-top,0px) + clamp(46px,10vmin,92px));left:50%;transform:translateX(-50%) scale(0);font-family:'Titan One','Nunito',sans-serif;font-size:clamp(18px,3.6vmin,26px);letter-spacing:.04em;padding:6px 18px;border:3px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink);white-space:nowrap;opacity:0}
#toast.show{animation:toast 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
#toast.reward{background:var(--gold);color:var(--ink)}
#toast.punish{background:#8b5cf6;color:#fff}
@keyframes toast{0%{transform:translateX(-50%) scale(0) rotate(-6deg);opacity:0}18%{transform:translateX(-50%) scale(1.1) rotate(2deg);opacity:1}30%{transform:translateX(-50%) scale(1) rotate(0)}75%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-18px) scale(.9);opacity:0}}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.legend .swatch{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.legend .swatch.reward{background:var(--gold)}
.legend .swatch.punish{background:#8b5cf6}
.fail-text{font-size:15px;font-weight:600;line-height:1.5;margin:10px 0 0}
#mute{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:46px;height:46px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;pointer-events:auto;padding:0;color:var(--ink)}
#mute svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#mute .off{display:none}
#mute.muted .on{display:none}
#mute.muted .off{display:block}
@media (prefers-reduced-motion:reduce){.chip.pulse,#score.pop,.card.in{animation:none}}
.mode-buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;pointer-events:auto;margin-top:4px}
.mode-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:14px 22px 12px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;font-family:inherit;color:var(--ink)}
.mode-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.mode-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.mode-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.mode-icon{font-size:26px;line-height:1.1}
.mode-name{font-family:'Titan One','Nunito',sans-serif;font-weight:400;font-size:17px;letter-spacing:.02em}
.mode-sub{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.mode-desc{text-align:left;font-size:14px;font-weight:600;line-height:1.8;margin:12px 0 0;color:var(--ink)}
.mode-desc ul{margin:8px 0 0;padding-left:0;list-style:none}
.mode-desc li{margin-bottom:2px}
.mode-desc li::before{content:'• ';color:var(--accent);font-weight:800}
.mode-actions{display:flex;gap:10px;margin-top:16px}
.mode-actions .btn{flex:1;margin-top:0}
.btn-back{flex:1;display:block;background:var(--paper-2);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:12px;font-family:'Titan One','Nunito',sans-serif;font-size:18px;letter-spacing:.04em;box-shadow:4px 4px 0 var(--muted);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn-back:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--muted)}
.btn-back:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--muted)}
.btn-back:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#livesDisplay{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));display:flex;gap:5px;pointer-events:none}
.life{font-size:clamp(22px,4.5vmin,32px);line-height:1;color:#ff4b6e;text-shadow:0 2px 0 var(--ink),0 0 8px rgba(255,75,110,.3);transition:opacity .3s,transform .3s}
.life.lost{opacity:.22;transform:scale(.85)}
</style>

<div id="game">
  <canvas id="c" aria-label="Flappy Dawn, a 3D flying game"></canvas>
  <div id="hud">
    <div id="score" class="display" hidden>0</div>
    <div id="toast" aria-live="polite"></div>
    <div id="livesDisplay" hidden><span class="life" id="life0">♥</span><span class="life" id="life1">♥</span><span class="life" id="life2">♥</span></div>
    <div id="title">
      <h1 class="display">Flappy Dawn</h1>
      <div class="mode-buttons" id="modeButtons">
        <button class="mode-btn" id="modeCompBtn" type="button"><span class="mode-icon">⚔</span><span class="mode-name">Competitive</span><span class="mode-sub">One life, pure skill</span></button>
        <button class="mode-btn" id="modeCasBtn" type="button"><span class="mode-icon">♥</span><span class="mode-name">Casual</span><span class="mode-sub">3 lives, keep trying</span></button>
      </div>
      <div class="chip small" id="bestChip" hidden>Best <b id="bestNum">0</b></div>
    </div>
    <div id="hint">Choose a mode to start</div>
    <div id="over" class="card" hidden role="dialog" aria-labelledby="overTitle">
      <div id="overTitle" class="eyebrow">Ouch!</div>
      <div class="stats">
        <div class="stat"><span class="lbl">Score</span><span class="num" id="finalScore">0</span></div>
        <div class="stat"><span class="lbl">Best</span><span class="num" id="finalBest">0</span></div>
      </div>
      <div id="medal" class="medal" hidden><span class="disc" id="medalDisc"></span><span id="medalTxt">Bronze medal</span></div>
      <div id="newbest" class="ribbon" hidden>New best!</div>
      <button id="again" class="btn" type="button">Play again</button>
      <div class="sub">or press Space</div>
    </div>
    <div id="modeInfo" class="card" hidden role="dialog" aria-labelledby="modeInfoTitle">
      <div id="modeInfoTitle" class="eyebrow">Competitive</div>
      <div id="modeInfoDesc" class="mode-desc"></div>
      <div class="mode-actions">
        <button id="enterBtn" class="btn" type="button">Enter</button>
        <button id="returnBtn" class="btn-back" type="button">Return</button>
      </div>
    </div>
    <button id="mute" type="button" aria-label="Mute sound">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/>
        <path class="on" d="M16 8.5a4 4 0 0 1 0 7"/>
        <path class="on" d="M18.5 6a7.5 7.5 0 0 1 0 12"/>
        <path class="off" d="M17 9l5 6M22 9l-5 6"/>
      </svg>
    </button>
    <div id="fail" class="card" hidden>
      <div class="eyebrow">No 3D today</div>
      <p class="fail-text">The 3D engine could not be loaded. Check your connection and reload the page.</p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('c'), gameEl = $('game'), scoreEl = $('score'), titleEl = $('title'), overEl = $('over'), hintEl = $('hint');
const finalScoreEl = $('finalScore'), finalBestEl = $('finalBest'), medalEl = $('medal'), medalDisc = $('medalDisc'), medalTxt = $('medalTxt');
const newBestEl = $('newbest'), bestChip = $('bestChip'), bestNum = $('bestNum'), muteBtn = $('mute'), againBtn = $('again');
const modeCompBtn = $('modeCompBtn'), modeCasBtn = $('modeCasBtn');
const modeInfoEl = $('modeInfo'), modeInfoTitle = $('modeInfoTitle'), modeInfoDesc = $('modeInfoDesc');
const enterBtn = $('enterBtn'), returnBtn = $('returnBtn');
const livesEl = $('livesDisplay');
const lifeEls = [$('life0'), $('life1'), $('life2')];

if (typeof THREE === 'undefined') { $('fail').hidden = false; titleEl.hidden = true; hintEl.hidden = true; return; }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const col = hex => new THREE.Color(hex).convertSRGBToLinear();
const DEG = Math.PI / 180;

/* ---------- persistence ---------- */
let best = 0, muted = false;
try { best = parseInt(localStorage.getItem('flappy-dawn-best') || '0', 10) || 0; muted = localStorage.getItem('flappy-dawn-muted') === '1'; } catch (e) {}
const saveBest = () => { try { localStorage.setItem('flappy-dawn-best', String(best)); } catch (e) {} };
const saveMute = () => { try { localStorage.setItem('flappy-dawn-muted', muted ? '1' : '0'); } catch (e) {} };

/* ---------- tuning ---------- */
const GROUND_Y = -3.5, CEIL_Y = 7.4, GRAVITY = -30, FLAP_V = 9.6, MAX_FALL = -17, BIRD_R = 0.42;
const PIPE_R = 0.9, RIM_R = 1.08, RIM_H = 0.7, PIPE_COUNT = 8, START_X = 15;
const CLIMB_RATE = 3.5, FALL_RATE = 10.0;
const DANGER_W = 2 * (RIM_R - 0.04 + BIRD_R);
const S_FLOOR = 5.0, S_CEIL = 12.0;
const CAM_X = 3.2, CAM_LOOK_X = 4.4, GROUND_W = 600, GROUND_D = 240, TILE = 8;

/* ---------- sound (synthesized, no files) ---------- */
const Sfx = (() => {
  let ctx = null, master = null;
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }
  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (!ctx) return;
    const t0 = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, vol, freq, delay = 0) {
    if (!ctx) return;
    const t0 = ctx.currentTime + delay, n = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.9;
    const g = ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(master); src.start(t0);
  }
  return {
    ensure,
    setMuted(m) { if (master) master.gain.value = m ? 0 : 0.5; },
    flap() { tone('triangle', 380, 900, 0.1, 0.16); noise(0.09, 0.14, 1800); },
    score() { tone('sine', 988, 988, 0.08, 0.16); tone('sine', 1319, 1319, 0.14, 0.16, 0.075); },
    hit() { tone('sawtooth', 190, 45, 0.28, 0.28); noise(0.22, 0.3, 500); },
    reward() { tone('sine', 660, 660, 0.07, 0.15); tone('sine', 880, 880, 0.07, 0.15, 0.07); tone('sine', 1320, 1320, 0.18, 0.15, 0.14); },
    punish() { tone('square', 240, 90, 0.3, 0.12); noise(0.25, 0.18, 350); },
    swoosh() { noise(0.25, 0.08, 900); }
  };
})();

/* ---------- renderer, camera, scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(col('#ffd9b4'), 30, 130);
const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 600);
let camDist = 15, camY = 2.2;
const lookTarget = new THREE.Vector3();

function resize() {
  const w = gameEl.clientWidth || window.innerWidth, h = gameEl.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  camera.aspect = aspect;
  camera.fov = aspect < 1 ? 62 : 46;
  camDist = clamp(10.5 / (Math.tan(camera.fov * 0.5 * DEG) * aspect), 14, 34);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* lights */
scene.add(new THREE.HemisphereLight(col('#bfe3ff'), col('#7fbf6a'), 0.6));
scene.add(new THREE.AmbientLight(col('#ffffff'), 0.1));
const sunLight = new THREE.DirectionalLight(col('#fff3d8'), 0.95);
sunLight.position.set(12, 18, 4);
sunLight.target.position.set(4, 0, 0);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -22, right: 22, top: 20, bottom: -16, near: 1, far: 70 });
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.03;
scene.add(sunLight, sunLight.target);

/* sky dome (gradient shader, follows the camera) */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(320, 32, 15),
  new THREE.ShaderMaterial({
    uniforms: {
      top: { value: new THREE.Color('#3f9be8') },
      mid: { value: new THREE.Color('#9dd6fa') },
      bottom: { value: new THREE.Color('#ffd9b4') }
    },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 bottom; varying vec3 vDir; void main(){ float h = vDir.y; vec3 c = h < 0.0 ? bottom : (h < 0.22 ? mix(bottom, mid, h / 0.22) : mix(mid, top, min((h - 0.22) / 0.6, 1.0))); gl_FragColor = vec4(c, 1.0); }',
    side: THREE.BackSide, depthWrite: false, fog: false
  })
);
sky.renderOrder = -1;
scene.add(sky);

/* sun disc + halo */
const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(11, 40), new THREE.MeshBasicMaterial({ color: col('#fff8dc'), fog: false }));
const sunHalo = new THREE.Mesh(new THREE.CircleGeometry(26, 40), new THREE.MeshBasicMaterial({ color: col('#fff0c2'), transparent: true, opacity: 0.32, fog: false, depthWrite: false }));
sunDisc.position.set(120, 62, -230);
sunHalo.position.copy(sunDisc.position);
sunDisc.lookAt(3, 2, 15); sunHalo.lookAt(3, 2, 15);
scene.add(sunDisc, sunHalo);

/* ground with a generated, seamless grass texture that scrolls */
function makeGrassTexture() {
  const s = 512, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#7cc86a'; g.fillRect(0, 0, s, s);
  const wrapDraw = fn => { for (const dx of [0, -s, s]) for (const dy of [0, -s, s]) fn(dx, dy); };
  const tones = ['#72bf61', '#89d477', '#69b85a', '#94db83', '#7fcd6f'];
  for (let i = 0; i < 420; i++) {
    const x = Math.random() * s, y = Math.random() * s, rx = rand(7, 30), ry = rand(4, 14), a = rand(0, Math.PI);
    g.fillStyle = tones[i % tones.length]; g.globalAlpha = 0.55;
    wrapDraw((dx, dy) => { g.beginPath(); g.ellipse(x + dx, y + dy, rx, ry, a, 0, Math.PI * 2); g.fill(); });
  }
  g.globalAlpha = 1;
  const flowers = ['#fff5c2', '#ffd1dc', '#ffffff', '#ffe08a', '#ffb3c6'];
  for (let i = 0; i < 150; i++) {
    const x = Math.random() * s, y = Math.random() * s, r = rand(1.6, 3.2);
    g.fillStyle = flowers[i % flowers.length];
    wrapDraw((dx, dy) => { g.beginPath(); g.arc(x + dx, y + dy, r, 0, Math.PI * 2); g.fill(); });
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(GROUND_W / TILE, GROUND_D / TILE);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const groundTex = makeGrassTexture();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(GROUND_W, GROUND_D), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1, metalness: 0 }));
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, GROUND_Y, -60);
ground.receiveShadow = true;
scene.add(ground);

/* ---------- shared geometry & materials ---------- */

const MAX_GAPS = 5, WARMUP_COLUMNS = 2, MIN_MID = 0.6;

function minTraverseGap() { return 3.75 * (DANGER_W / speed) ** 2 + 2 * BIRD_R; }
function maxAllowedGaps() {
  const lo = GROUND_Y + 1.0, hi = CEIL_Y - 1.0, available = hi - lo;
  const minGap = minTraverseGap();
  for (let n = MAX_GAPS; n >= 1; n--) {
    let pg = (available - (n - 1) * MIN_MID) / n;
    if (n === 2) pg = Math.min(pg, 2.8);
    pg = clamp(pg, BIRD_R * 3, currentGap());
    if (pg >= minGap) return n;
  }
  return 1;
}
function spacingBounds() {
  return [Math.max(S_FLOOR, DANGER_W + speed * 0.25), Math.min(S_CEIL, DANGER_W + speed * 1.0)];
}
function screenRight() {
  return CAM_X + camDist * camera.aspect * Math.tan(camera.fov * 0.5 * DEG) + 2;
}
function computeSpacing(prev, next) {
  if (!prev || !prev.length) return S_FLOOR;
  let minS = Infinity, maxS = 0;
  for (const p of prev) for (const n of next) {
    const dy = n.y - p.y;
    const s = DANGER_W + speed * (dy >= 0 ? dy / CLIMB_RATE : -dy / FALL_RATE);
    if (s < minS) minS = s;
    if (s > maxS) maxS = s;
  }
  return Math.max(S_FLOOR, lerp(minS, maxS, 0.35) + 0.05);
}

const starGeo = (() => {

const spikeGeo = new THREE.ConeGeometry(0.1, 0.32, 5);
const coreGeo = new THREE.IcosahedronGeometry(0.3, 0);
const spikeDirs = (() => {
  const pos = new THREE.IcosahedronGeometry(1, 0).attributes.position, dirs = [], seen = new Set();
  for (let i = 0; i < pos.count; i++) {
    const v = new THREE.Vector3().fromBufferAttribute(pos, i), k = v.toArray().map(n => n.toFixed(2)).join(',');
    if (!seen.has(k)) { seen.add(k); dirs.push(v.normalize()); }

})();
const UP = new THREE.Vector3(0, 1, 0);
function makeMarker(parent) {
  const g = new THREE.Group();
  const star = new THREE.Mesh(starGeo, starMat); star.castShadow = true; g.add(star);
  const thorn = new THREE.Group();
  const core = new THREE.Mesh(coreGeo, thornMat); core.castShadow = true; thorn.add(core);

const pipes = [];
function makeColumn() {
  const g = new THREE.Group();
  const mk = (geo, mat) => { const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; g.add(m); return m; };
  const bodies = [], rims = [], markers = [];

  for (let i = 0; i < MAX_GAPS * 2; i++) rims.push(mk(rimGeo, rimMat));

/* gaps: [{ y, size, marker: 'reward' | 'punish' | null }, ...] sorted bottom to top; pipe segments fill the space between them */
function placeColumn(c, x, gaps) {
  c.x = x; c.g.position.x = x; c.scored = false;
  c.gaps = gaps.slice().sort((a, b) => a.y - b.y);
  c.segs = [];
  let y0 = -22;
  c.gaps.forEach((gap, i) => {
    const gb = gap.y - gap.size / 2, gt = gap.y + gap.size / 2;
    c.segs.push([y0, gb]);
    c.rims[i * 2].position.y = gb - RIM_H / 2 + 0.02;
    c.rims[i * 2 + 1].position.y = gt + RIM_H / 2 - 0.02;
    const m = c.markers[i];

    m.g.visible = !!m.kind;
    m.star.visible = m.kind === 'reward';
    m.thorn.visible = m.kind === 'punish';

let lastGapY = 1.2, columnsMade = 0, lastGapCount = 1, lastPlacedGaps = [];
const currentGap = () => Math.max(2.7, 3.5 - score * 0.03);
const rollMarker = () => { const r = Math.random(); return r < 0.45 ? 'reward' : r < 0.8 ? 'punish' : null; };
function pickGapCount() {
  if (columnsMade <= WARMUP_COLUMNS) return 1;
  const tiers = [
    [1, 1.0],
    [2, score >= 3  ? Math.min(1.0, (score - 3) * 0.08) : 0],
    [3, score >= 10 ? Math.min(0.7, (score - 10) * 0.04) : 0],
    [4, score >= 20 ? Math.min(0.4, (score - 20) * 0.025) : 0],
    [5, score >= 35 ? Math.min(0.2, (score - 35) * 0.015) : 0],
  ];
  const total = tiers.reduce((s, t) => s + t[1], 0);
  let r = Math.random() * total;
  for (const [n, w] of tiers) { r -= w; if (r <= 0) return Math.min(n, maxAllowedGaps()); }
  return 1;
}
function makeGaps(prevGaps) {
  const lo = GROUND_Y + 1.0, hi = CEIL_Y - 1.0, available = hi - lo;
  columnsMade++;
  const [, sMax] = spacingBounds();
  for (let attempt = 0; attempt < 4; attempt++) {
    const nGaps = pickGapCount();
    let gaps;
    if (nGaps === 1) {
      const gap = currentGap();
      const baseWalk = lastGapCount >= 3 ? 1.5 : lastGapCount === 2 ? 2.2 : 3;
      const walk = baseWalk * (0.6 ** attempt);
      const y = clamp(lastGapY + rand(-walk, walk), lo + gap / 2, Math.min(hi - gap / 2, 4.4));
      gaps = [{ y, size: gap, marker: null }];
    } else {
      const baseGap = currentGap();
      let perGap = (available - (nGaps - 1) * MIN_MID) / nGaps;
      if (nGaps === 2) perGap = Math.min(perGap, 2.8);
      perGap = clamp(perGap, BIRD_R * 3, baseGap);
      const midCount = nGaps - 1;
      const midSize = clamp((available - nGaps * perGap) / midCount, MIN_MID, 1.0);
      const slack = Math.max(0, available - nGaps * perGap - midCount * midSize);
      let b0;
      if (slack > 0.01) {
        const stride = perGap + midSize;
        const biasY = clamp(lastGapY, 0.5, 2.0);
        let idealB0 = lo, bestD = Infinity;
        for (let j = 0; j < nGaps; j++) {
          const ib = biasY - perGap / 2 - j * stride;
          const cb = clamp(ib, lo, lo + slack);
          const d = Math.abs(cb + perGap / 2 + j * stride - biasY) + j * 0.6;
          if (d < bestD) { bestD = d; idealB0 = cb; }
        }
        b0 = clamp(idealB0 + rand(-slack * 0.15, slack * 0.15), lo, lo + slack);
      } else {
        b0 = lo;
      }
      gaps = [];
      let y = b0;
      for (let i = 0; i < nGaps; i++) {
        gaps.push({ y: y + perGap / 2, size: perGap, marker: rollMarker() });
        y += perGap + (i < midCount ? midSize : 0);
      }
      if (gaps.every(g => !g.marker)) gaps[Math.floor(Math.random() * nGaps)].marker = Math.random() < 0.6 ? 'reward' : 'punish';
    }
    if (!prevGaps || !prevGaps.length || computeSpacing(prevGaps, gaps) <= sMax) {
      lastGapY = gaps.reduce((b, g) => Math.abs(g.y - lastGapY) < Math.abs(b.y - lastGapY) ? g : b).y;
      lastGapCount = gaps.length;
      return gaps;
    }
  }
  const gap = currentGap();
  const safeY = prevGaps.length ? prevGaps[Math.floor(prevGaps.length / 2)].y : 1.2;
  const y = clamp(safeY + rand(-0.5, 0.5), lo + gap / 2, Math.min(hi - gap / 2, 4.4));
  lastGapY = y; lastGapCount = 1;
  return [{ y, size: gap, marker: null }];
}
function parkPipes() { for (const c of pipes) { c.x = 200; c.g.position.x = 200; c.scored = true; } }
function animateMarkers(dt) {
  for (const c of pipes) {
    if (c.x > 60 || c.x < -20) continue;
    c.markers.forEach((m, i) => {
      if (!m.g.visible) return;
      m.g.rotation.y += dt * 2.2;
      m.g.position.y = c.gaps[i].y + Math.sin(t * 3 + m.phase) * 0.12;
      if (m.kind === 'punish') m.thorn.rotation.x += dt * 0.9;
    });
  }
}

function emit(kind, n, x, y, z, mats, spd, life, grav, up) {

/* ---------- game state ---------- */

/* ---------- input ---------- */
gameEl.addEventListener('pointerdown', e => {

modeCompBtn.addEventListener('click', e => { e.stopPropagation(); modeCompBtn.blur(); selectMode('competitive'); });

}

muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); muteBtn.blur(); });
applyMute();

/* ---------- main loop ---------- */
function updatePlaying(dt) {
